extendsId: base
name: Staging
description: Production-like topology with execution network and Vault secrets.
default: false

# network.mode: execution — containers reach each other by name
# (db, stripe-mock and the test steps all on the same bridge)
network:
  mode: execution

env:
  LOG_LEVEL: info
  PAYMENTS_API_BASE_URL: https://payments.staging.company.test
  FRAUD_STRATEGY: strict
  FRAUD_REPLICAS: "3"

secretRefs:
  - key: DB_PASSWORD
    provider: Vault
    ref: kv/payment-suite/staging-db-password

services:
  checkout-smoke:
    env:
      API_PORT: 8080
      ROUTING_MODE: staging
