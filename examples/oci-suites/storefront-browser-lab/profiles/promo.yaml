name: Promo Burst
description: All browsers, promo fixtures, GPU-accelerated catalog seeding.
default: false
# Only an agent tagged gpu-enabled may run this profile: a step below asks
# for a GPU, and a backend without one would fail it or silently skip it.
agent:
  tags: [gpu-enabled]

network:
  mode: execution

env:
  LOG_LEVEL: info
  BROWSERS: chromium,firefox,webkit

services:
  seed-products:
    devices: ["gpu"]
  storefront:
    env:
      API_PORT: 3000
      PROMO_MODE: enabled
      DISCOUNT_CAP: "50"
