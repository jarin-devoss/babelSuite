# Each imported suite calls pg(), so four of them — this one included — declare
# a service whose network alias would be "db". This suite keeps the bare name;
# an imported suite's service answers to "<suite>-db" instead, so the name
# resolves to one container rather than round-robinning between databases.
#
# POSTGRES_URL points each dependency at its own. Both the postgres module and
# the suites' own scripts read "${POSTGRES_URL:-...}" before falling back to a
# hostname, so this is all that is needed — and without it the fallback
# resolves to nothing and the step says so, rather than reading another suite's
# database.
dependencies:
  payment-suite:
    ref: localhost:5000/core-platform/payment-suite
    profile: local.yaml
    inputs:
      PAYMENT_LEDGER_MODE: readiness
      STRIPE_BASE_URL: http://stripe-mock:8080
      POSTGRES_URL: postgresql://postgres:postgres@payment-suite-db:5432/app
  identity-broker:
    ref: localhost:5000/security/identity-broker
    profile: local.yaml
    inputs:
      POSTGRES_URL: postgresql://postgres:postgres@identity-broker-db:5432/app
  returns-control-plane:
    ref: localhost:5000/qa/returns-control-plane
    profile: local.yaml
    inputs:
      POSTGRES_URL: postgresql://postgres:postgres@returns-control-plane-db:5432/app
  notification-hub:
    ref: localhost:5000/platform/notification-hub
    profile: local.yaml
  fleet-control-room:
    ref: localhost:5000/platform/fleet-control-room
    profile: local.yaml
