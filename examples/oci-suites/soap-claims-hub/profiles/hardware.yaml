name: Hardware Device
description: Runs verify-findings against a physical claims processor connected over USB.
default: false
# Only an agent tagged usb-serial — a host with the device attached — may run
# this profile: a step below needs /dev/ttyUSB0.
agent:
  tags: [usb-serial]

network:
  mode: execution

env:
  LOG_LEVEL: info
  CLAIM_TYPES: medical,dental
  LEGACY_MODE: "true"

# verify-findings gets direct access to the USB claims device
services:
  verify-findings:
    devices: ["/dev/ttyUSB0"]
  claims-api:
    env:
      VALIDATION_LEVEL: strict
