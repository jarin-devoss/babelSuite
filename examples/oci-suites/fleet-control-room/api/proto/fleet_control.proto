syntax = "proto3";

package fleet_control_room.v1;

// RoutePlanner turns a route request into an assignment for one vehicle.
service RoutePlanner {
  rpc AssignRoute (AssignRouteRequest) returns (AssignRouteResponse);
}

message AssignRouteRequest {
  string routeId = 1;
  string vehicleId = 2;
  string zone = 3;
}

message AssignRouteResponse {
  string status = 1;
  string assignmentId = 2;
  string plannerRevision = 3;
}
