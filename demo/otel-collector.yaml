# Minimal collector for the demo: accept OTLP, print to stdout.
#
# `docker compose logs -f otel-collector` then shows the runner.run span for
# each step, including the runner.plugin.* attributes a Lua plugin reported.
# Swap the debug exporter for a real backend when you want to keep the data.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    # normal | detailed — detailed prints every attribute, which is the point
    # of running this at all.
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
