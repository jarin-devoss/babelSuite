name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "stable"

jobs:
  tidy:
    name: Verify go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Check go.mod tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: v2.5.0

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Build all binaries
        working-directory: backend
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Docker version
        run: docker version
      # The tests pull what they need, so this is not what makes them pass; it
      # keeps a slow registry from being charged to whichever test runs first.
      - name: Pull test database images
        run: |
          docker pull -q postgres:16 &
          docker pull -q mongo:7.0 &
          wait
      - name: Run tests
        working-directory: backend
        env:
          GOGC: "50"
        run: go test -race -p 2 -timeout 10m ./...

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      # The traffic cannon and the security scanner run inside a real APISIX
      # sidecar. These tests start one; the Kafka and schema-registry plugin
      # tests need several large images and stay a local run.
      - name: Run the APISIX integration tests
        working-directory: backend
        run: go test -tags integration -timeout 10m ./internal/runner -run Integration -skip IntegrationPlugin -count=1
